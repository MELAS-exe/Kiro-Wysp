[project]
name = "wysp-core"
version = "0.1.0"
description = "Wysp Core: application-agnostic tutoring engine"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "jmespath>=1.0",
    "jsonschema>=4.23",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "comtypes==1.5.0; sys_platform == 'win32'",  # offline Windows voices for /api/tts
    # Windows' built-in OCR for /api/ocr (hybrid adapters locating labels on their own screenshots)
    "winrt-runtime==4.1.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation==4!10.0.28000.2957; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections==4!10.0.28000.2957; sys_platform == 'win32'",
    "winrt-Windows.Globalization==4!10.0.28000.2957; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging==4!10.0.28000.2957; sys_platform == 'win32'",
    "winrt-Windows.Media.Ocr==4!10.0.28000.2957; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams==4!10.0.28000.2957; sys_platform == 'win32'",
    "sounddevice==0.5.6",  # push-to-talk recording for /api/listen (bundles PortAudio on Windows)
    "mcp==2.3.0",  # MCP server so Claude Code, kiro-cli... can drive the tutor (/mcp)
]

[project.optional-dependencies]
voice = ["kokoro-onnx>=0.4"]  # offline female voice (WYSP_TTS_PROVIDER=kokoro)

[project.scripts]
wysp = "wysp_core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wysp_core"]
