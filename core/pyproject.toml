[project]
name = "wysp-core"
version = "0.1.0"
description = "Wysp Core: application-agnostic tutoring engine"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "jmespath>=1.0",
    "jsonschema>=4.23",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "comtypes==1.5.0; sys_platform == 'win32'",  # offline Windows voices for /api/tts
]

[project.scripts]
wysp = "wysp_core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wysp_core"]
