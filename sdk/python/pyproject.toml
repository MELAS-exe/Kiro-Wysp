[project]
name = "wysp-adapter-sdk"
version = "0.1.0"
description = "Wysp Python adapter SDK (pure Python, embeddable in Blender)"
requires-python = ">=3.13"
dependencies = [
    "websocket-client>=1.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wysp_adapter_sdk"]
