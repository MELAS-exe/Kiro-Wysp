name: CI

on:
  push:
    branches: [main]
  pull_request:

# Everything here runs without Blender, IntelliJ, a browser or any LLM, STT or TTS provider:
# the Core is tested against the mock adapter, the Blender adapter against a fake `bpy`.
# The IntelliJ plugin builds against the locally installed IDE (no SDK download), so it is built and tested on
# a developer machine: `apps/intellij-tutor/plugin/gradlew.bat buildPlugin test`.
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --all-groups --frozen
      - name: Lint and format
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
      - name: Core boundary (no application vocabulary in core/)
        run: uv run --no-project python scripts/kiro/hook.py boundaries
      - name: Generated schemas are up to date
        run: |
          uv run --no-sync python -m wysp_core.contract.export
          git diff --exit-code -- schemas
      - name: Profiles are valid
        run: |
          uv run --no-sync wysp validate-profile apps/blender-tutor/profile
          uv run --no-sync wysp validate-profile apps/intellij-tutor/profile
      - name: Contract kit (offline fixtures of both tutors)
        run: |
          uv run --no-sync wysp-contract --tutor blender-tutor --offline
          uv run --no-sync wysp-contract --tutor intellij-tutor --offline
          uv run --no-sync wysp-contract --tutor web-tutor --offline
      - name: Contract kit (observation property checks on the mock adapter)
        run: uv run --no-sync wysp-contract --mock
      - name: Tests
        run: uv run --no-sync pytest -q -p no:cacheprovider

  # The Contract Test Kit against the mock adapter (adapter-contract task 10). Blender, Chrome and IntelliJ are not
  # available here: run them on a developer machine (docs/adapter-guide.md, "The Contract Test Kit").
  contract-kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --all-groups --frozen
      - name: Kit, online harness on the mock adapter (a real WebSocket) must be green
        run: uv run --no-sync wysp-contract --fixture contract-tests/fixtures/mock/contract.fixture.yaml --junit contract-tests/reports/mock.junit.xml
      - name: Kit with 300 ms of latency must stay green
        run: uv run --no-sync wysp-contract --fixture contract-tests/fixtures/mock/contract.fixture.yaml --fault latency_ms=300
      - name: Fault injection, each deliberate fault must make the kit FAIL (exit code 1)
        run: |
          for fault in wrong_origin undo_noop undeclared_kind postcondition_lie state_version_regression dirty_invalid dry_run_mutates unstable_digest; do
            if uv run --no-sync wysp-contract --fixture contract-tests/fixtures/mock/contract.fixture.yaml --fault "$fault" --junit "contract-tests/reports/fault-$fault.junit.xml"; then
              echo "::error::the kit stayed green with the fault $fault"
              exit 1
            fi
          done
      - name: Fault injection, the kit's own tests say which check catches which fault
        run: uv run --no-sync pytest -q -p no:cacheprovider contract-tests/tests/test_kit_faults.py contract-tests/tests/test_kit_checks.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-kit-junit
          path: contract-tests/reports/*.junit.xml

  panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w panel
      - run: npm test -w panel
      - run: npm run build -w panel

  sdk-ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Generated types are up to date
        run: |
          npm run gen:types -w sdk/ts
          git diff --exit-code -- sdk/ts/src/generated
      - run: npm run typecheck -w sdk/ts
      - run: npm test -w sdk/ts
