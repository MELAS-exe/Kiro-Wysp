[project]
name = "wysp-contract-tests"
version = "0.1.0"
description = "Wysp Contract Test Kit and mock adapter"
requires-python = ">=3.13"
dependencies = [
    "wysp-core",
    "wysp-adapter-sdk",
    "websockets>=13.0",
    "pyyaml>=6.0",
]

[project.scripts]
wysp-contract = "wysp_contract.cli:main"
wysp-mock-adapter = "wysp_mock.cli:main"

[tool.uv.sources]
wysp-core = { workspace = true }
wysp-adapter-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wysp_contract", "wysp_mock"]
