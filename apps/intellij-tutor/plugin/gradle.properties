# Where IntelliJ IDEA 2026.2 is installed. Override it in ~/.gradle/gradle.properties on another machine.
intellijPath=C:/Program Files/JetBrains/IntelliJ IDEA 2026.2

# Compile with the IDE's own runtime (JBR 25, it includes javac); never download a JDK.
org.gradle.java.installations.paths=C:/Program Files/JetBrains/IntelliJ IDEA 2026.2/jbr
org.gradle.java.installations.auto-download=false

# The IDE bundles the Kotlin standard library (2.4.0 in 2026.2): do not ship another one.
kotlin.stdlib.default.dependency=false

org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
