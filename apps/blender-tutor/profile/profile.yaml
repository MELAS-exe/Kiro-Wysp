id: blender-tutor
app: Blender
languages: [en]
primer: >
  Blender is a free 3D creation suite. A scene holds collections and objects (meshes, lights,
  cameras). A mesh can carry a stack of modifiers, non-destructive operations evaluated top to bottom,
  so order matters: Subdivision Surface (smooths), Bevel (rounds edges), Solidify (thickness), Mirror,
  Array. Modifier settings are in the Properties editor, blue wrench tab; applying a modifier bakes
  it into the mesh. New objects come from the Add menu of the 3D Viewport header (Shift+A).
  Edit Mode (Tab) edits a mesh's vertices; its header then shows Vertex, Edge, Face and Mesh menus.
  Teach with the user's real scene and let them do the steps.
  Pointing (highlight tool or cue): blender://ui/area/<VIEW_3D|OUTLINER|PROPERTIES|TIMELINE>;
  blender://ui/region/VIEW_3D/<HEADER|TOOLBAR|GIZMO>; blender://ui/properties/tab/<TAB> (TOOL,
  RENDER, OUTPUT, VIEW_LAYER, SCENE, WORLD, COLLECTION, OBJECT, MODIFIER, PARTICLES, PHYSICS,
  CONSTRAINT, DATA, MATERIAL, TEXTURE; this also opens the tab); and any visible text with
  blender://ui/label/<EDITOR>/<text>, e.g. blender://ui/label/VIEW_3D/Add or
  blender://ui/label/PROPERTIES/Add%20Modifier. Only text visible right now can be found: items
  inside a closed menu (Mesh > Cube inside Add) appear only once the user opens it, so point at the
  menu itself and name the item in words. Icons without text cannot be found by label: point at the
  region and describe the icon. The 3D Viewport sidebar (N) is Wysp's own chat: never point there.
speech_hints: [Blender, cube, cylinder, plane, sphere, mesh, vertex, vertices, edge, face, Edit Mode,
  Object Mode, modifier, Bevel, Subdivision Surface, Solidify, Mirror, Array, Bisect, extrude, Outliner,
  Properties, viewport, Pumpkin, Candle]
board:
  # What each kind shows on its board node, in order (at most 6).
  props:
    object: [type, modifiers_count, material, vertices]
    modifier: [type, index, show_viewport, levels, segments, width, thickness]
    collection: [objects]
    material: [users]
skills:
  - {id: scene_navigation, title: {en: "Read the scene"}, prior: 0.3}
  - {id: modifier_stack, title: {en: "Understand the modifier stack"}, prerequisites: [scene_navigation]}
  - {id: subdivision_surface, title: {en: "Smooth a mesh with Subdivision Surface"}, prerequisites: [modifier_stack]}
  - {id: bevel_modifier, title: {en: "Round edges with a Bevel"}, prerequisites: [modifier_stack]}
